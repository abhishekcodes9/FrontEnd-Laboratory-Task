
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student ID Card Generator</title>

    <link rel="stylesheet" href="project.css">
</head>
<body>

    <header>
        <h1>Student ID Card Generator</h1>
        <p>Create your digital student identity card</p>
    </header>

    <div class="container">

        <!-- Student Form -->

        <div class="form-box">

            <h2>Enter Student Details</h2>

            <form id="student-form">

                <label>Student Name</label>
                <input type="text" id="name"
                    placeholder="Enter your name" required>

                <label>Roll Number</label>
                <input type="text" id="roll"
                    placeholder="Enter roll number" required>

                <label>Course</label>
                <input type="text" id="course"
                    placeholder="e.g. B.Tech CSE" required>

                <label>Year</label>
                <select id="year" required>
                    <option value="">Select Year</option>
                    <option value="1st Year">1st Year</option>
                    <option value="2nd Year">2nd Year</option>
                    <option value="3rd Year">3rd Year</option>
                    <option value="4th Year">4th Year</option>
                </select>

                <label>Email Address</label>
                <input type="email" id="email"
                    placeholder="Enter email address" required>

                <button type="submit">Generate ID Card</button>

            </form>

        </div>

        <!-- Generated ID Card -->

        <div class="card-box" id="card-box">

            <h2>Your Student ID Card</h2>

            <div class="id-card">

                <div class="card-header">
                    <h3>ABC COLLEGE</h3>
                    <p>STUDENT IDENTITY CARD</p>
                </div>

                <div class="avatar" id="avatar">
                    ?
                </div>

                <h2 id="display-name">Student Name</h2>

                <div class="details">
                    <p><strong>Roll No:</strong>
                        <span id="display-roll">---</span>
                    </p>

                    <p><strong>Course:</strong>
                        <span id="display-course">---</span>
                    </p>

                    <p><strong>Year:</strong>
                        <span id="display-year">---</span>
                    </p>

                    <p><strong>Email:</strong>
                        <span id="display-email">---</span>
                    </p>
                </div>

                <div class="card-footer">
                    <p>VALID STUDENT IDENTITY</p>
                </div>

            </div>

            <button id="reset-btn" class="reset-btn" type="button">
                Create Another ID
            </button>

        </div>

    </div>

    <footer>
        <p>Student ID Card Generator | Mini Project</p>
    </footer>

    <script src="project.js"></script>

</body>
</html>
